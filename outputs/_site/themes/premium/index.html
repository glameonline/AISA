<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Premium theme preview · ContentFellow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--soft:#eee;--ac:#c9541a;--ink:#1c1a17;--p:0}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink);overflow-x:hidden}
a{color:inherit}.wrap{max-width:1200px;margin:auto;padding:0 24px}
#load{position:fixed;inset:0;z-index:99;background:var(--ink);color:var(--soft);display:grid;place-items:center;font:800 clamp(40px,10vw,120px) Syne;transition:clip-path 1s cubic-bezier(.8,0,.2,1) .3s;clip-path:inset(0 0 0 0)}
#load.go{clip-path:inset(0 0 100% 0)}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--ac);z-index:50;width:calc(var(--p)*100%)}
.cur{position:fixed;width:18px;height:18px;border-radius:50%;background:var(--ac);pointer-events:none;z-index:60;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .25s,height .25s}
.cur.big{width:70px;height:70px}@media(hover:none){.cur{display:none}}
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;mix-blend-mode:difference;color:#fff}
.logo{font:800 20px Syne;display:flex;gap:8px}
.btn{display:inline-flex;gap:10px;align-items:center;text-decoration:none;font-weight:600;padding:16px 28px;border-radius:999px;background:var(--ink);color:var(--soft);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
nav .btn{background:#fff;color:#000;padding:10px 18px}
.hero{height:200vh;position:relative}
.stick{position:sticky;top:0;height:100svh;display:grid;place-items:center;overflow:hidden}
.big{font:800 clamp(56px,15vw,220px)/.85 Syne;text-align:center;letter-spacing:-.04em;text-transform:uppercase;transform:scale(calc(1 + var(--h,0)*1.8));opacity:calc(1 - var(--h,0)*1.4)}
.big span{display:block;color:var(--ac)}
.circle{position:absolute;width:40vmin;height:40vmin;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:18vmin;transform:scale(calc(.2 + var(--h,0)*6));z-index:-1}
.hint{position:absolute;bottom:28px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:calc(1 - var(--h,0)*4)}
.intro{padding:20vh 0}.fill{font:600 clamp(28px,4.4vw,58px)/1.15 Syne;max-width:22ch}
.fill span{color:color-mix(in srgb,var(--ink) 18%,transparent);transition:color .2s}.fill span.on{color:var(--ink)}
.hs{height:400vh;position:relative}.hs .stick{place-items:center start}
.track{display:flex;gap:4vw;padding-left:8vw;will-change:transform}
.panel{flex:0 0 min(78vw,520px);height:min(68vh,560px);border-radius:32px;padding:40px;background:var(--ink);color:var(--soft);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.panel:nth-child(even){background:var(--ac)}.panel b{font:800 clamp(80px,12vw,160px)/1 Syne;opacity:.25}.panel h3{font:800 clamp(30px,4vw,48px)/1 Syne;margin:0}
.panel::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:2px solid currentColor;opacity:.15;right:-80px;top:-80px}
.hs-title{position:absolute;top:12vh;left:8vw;font:800 14px Inter;letter-spacing:.2em;text-transform:uppercase}
.num{padding:20vh 0;text-align:center}.num b{font:800 clamp(90px,22vw,300px)/1 Syne;color:var(--ac);display:block}
.par{height:70vh;position:relative;overflow:hidden;display:grid;place-items:center;background:var(--ink);color:var(--soft)}
.par .l{position:absolute;font-size:30vmin;opacity:.12;will-change:transform}.par h2{font:800 clamp(36px,6vw,80px)/1 Syne;text-align:center;margin:0}
.cta{padding:22vh 0;text-align:center}.cta h2{font:800 clamp(44px,9vw,130px)/.9 Syne;margin:0 0 40px;letter-spacing:-.03em}
.mag{display:inline-block}
footer{padding:28px 24px;text-align:center;font-size:14px;opacity:.7}
@media(prefers-reduced-motion:reduce){.big,.circle{transform:none!important}#load{display:none}}
</style></head><body>
<div id="load"><span class="brand"></span></div><div class="bar"></div><div class="cur"></div>
<nav><div class="logo"><span id="em"></span><span class="brand"></span></div><a class="btn call" href="#">📞 Call</a></nav>
<section class="hero" id="hero"><div class="stick"><div class="circle" id="art"></div><div class="big"><div class="ind"></div><span>done right</span></div><div class="hint">Scroll ↓</div></div></section>
<section class="intro"><div class="wrap"><p class="fill" id="fill"></p></div></section>
<section class="hs" id="hs"><div class="stick"><div class="hs-title">What we do · scroll</div><div class="track" id="track"></div></div></section>
<section class="num"><div class="wrap"><b id="cnt">0</b><p>happy customers and counting</p></div></section>
<section class="par" id="par"><div class="l" style="left:8%;top:10%" data-s=".4"></div><div class="l" style="right:6%;bottom:6%" data-s="-.3"></div><h2 class="tag"></h2></section>
<section class="cta"><div class="wrap"><h2>Let's talk.</h2><span class="mag"><a class="btn call" href="#">📞 <span class="ctat"></span></a></span></div></section>
<footer><span class="brand"></span> · Sample website by ContentFellow · Premium theme (scroll motion) · <a class="cf-prof" href="https://maps.google.com/?cid=6675954353271833173" rel="noopener" target="_blank">Google Maps &amp; reviews</a> · <a href="https://www.yell.com/biz/content-fellow-burnley-11050665/" rel="noopener" target="_blank">Yell</a></footer>
<script src="/themes/industries.js"></script><script src="/themes/fill.js"></script>
<script>
var d=IND[indKey()],R=document.documentElement;
document.querySelectorAll(".par .l").forEach(function(l){l.textContent=d.e});
var txt=d.b+" is the "+d.n.toLowerCase()+" people recommend. We listen, we turn up, and we do the job properly, every single time.";
document.getElementById("fill").innerHTML=txt.split(" ").map(function(w){return"<span>"+w+" </span>"}).join("");
document.getElementById("track").innerHTML=d.s.map(function(s,i){return'<div class="panel"><b>0'+(i+1)+'</b><div><h3>'+s+'</h3><p>Expert '+s.toLowerCase()+' with clear prices and a friendly team.</p></div></div>'}).join("")+'<div class="panel"><b>→</b><div><h3>'+d.cta+'</h3><p>Tap call and talk to us now.</p></div></div>';
var lw=Math.max.apply(null,(d.n+" done right").split(" ").map(function(w){return w.length}));document.querySelector(".big").style.fontSize="min("+Math.min(13,84/lw).toFixed(1)+"vw,220px)";
setTimeout(function(){document.getElementById("load").classList.add("go")},700);
var hero=document.getElementById("hero"),hs=document.getElementById("hs"),tr=document.getElementById("track"),words=document.querySelectorAll("#fill span"),cnt=document.getElementById("cnt"),par=document.getElementById("par");
function prog(el){var r=el.getBoundingClientRect();return Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)))}
function tick(){
 R.style.setProperty("--p",scrollY/(R.scrollHeight-innerHeight));
 R.style.setProperty("--h",prog(hero));
 var p=prog(hs);tr.style.transform="translateX("+(-p*(tr.scrollWidth-innerWidth+innerWidth*.16))+"px)";
 var fr=document.getElementById("fill").getBoundingClientRect(),fp=Math.min(1,Math.max(0,(innerHeight*.85-fr.top)/(fr.height+innerHeight*.4)));
 words.forEach(function(w,i){w.classList.toggle("on",i<fp*words.length)});
 var cr=cnt.getBoundingClientRect(),cp=Math.min(1,Math.max(0,(innerHeight-cr.top)/innerHeight));cnt.textContent=Math.round(cp*500)+"+";
 var pr=par.getBoundingClientRect();par.querySelectorAll(".l").forEach(function(l){l.style.transform="translateY("+(pr.top*l.dataset.s)+"px) rotate("+pr.top*.05+"deg)"});
 requestAnimationFrame(tick)}
tick();
var cur=document.querySelector(".cur");addEventListener("pointermove",function(e){cur.style.left=e.clientX+"px";cur.style.top=e.clientY+"px"});
document.querySelectorAll("a,.panel").forEach(function(a){a.addEventListener("pointerenter",function(){cur.classList.add("big")});a.addEventListener("pointerleave",function(){cur.classList.remove("big")})});
document.querySelectorAll(".mag").forEach(function(m){var b=m.firstElementChild;m.addEventListener("pointermove",function(e){var r=m.getBoundingClientRect();b.style.transform="translate("+(e.clientX-r.left-r.width/2)*.3+"px,"+(e.clientY-r.top-r.height/2)*.4+"px)"});m.addEventListener("pointerleave",function(){b.style.transform=""})});
</script></body></html>
