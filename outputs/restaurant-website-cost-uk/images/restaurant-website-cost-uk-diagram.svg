<text x='50' y='132' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' fill='#9a968e'>The four pages that earn their keep</text><rect x='50' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='100' cy='255' r='28' fill='#ff5a1f'/><text x='100' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>1</text><text x='74' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Menu</text><text x='74' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Text, not PDF</text><text x='74' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Prices and allergens</text><text x='74' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Easy to update</text><rect x='335' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='385' cy='255' r='28' fill='#ff5a1f'/><text x='385' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>2</text><text x='359' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Bookings</text><text x='359' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Table booking</text><text x='359' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Party enquiries</text><text x='359' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Deposits</text><rect x='620' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='670' cy='255' r='28' fill='#ff5a1f'/><text x='670' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>3</text><text x='644' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Ordering</text><text x='644' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Collection or delivery</text><text x='644' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>0% commission</text><text x='644' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Card fees only</text><rect x='905' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#ff5a1f' stroke-width='2'/><circle cx='955' cy='255' r='28' fill='#ff5a1f'/><text x='955' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>4</text><text x='929' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Get found</text><text x='929' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Google Business Profile</text><text x='929' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Opening hours</text><text x='929' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Reviews</text><text x='50' y='560' font-family='Inter,Helvetica,Arial,sans-serif' font-size='20' fill='#9a968e'>contentfellow.com</text></svg>