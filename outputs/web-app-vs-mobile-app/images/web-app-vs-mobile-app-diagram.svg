<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630'><rect width='1200' height='630' fill='#0c0c0d'/>
<text x='50' y='90' font-family='Inter,Helvetica,Arial,sans-serif' font-size='36' fill='#f5f3ee' font-weight='800'>Choose a web app or mobile app</text>
<text x='50' y='132' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' fill='#9a968e'>Four questions that decide it</text><rect x='50' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='100' cy='255' r='28' fill='#ff5a1f'/><text x='100' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>1</text><text x='74' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Need the app</text><text x='74' y='358' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>stores?</text><text x='74' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Discovery in stores</text><text x='74' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Brand credibility</text><text x='74' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Native wins</text><rect x='335' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='385' cy='255' r='28' fill='#ff5a1f'/><text x='385' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>2</text><text x='359' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Phone features?</text><text x='359' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Camera, GPS, offline</text><text x='359' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Bluetooth, health</text><text x='359' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Native wins</text><rect x='620' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='670' cy='255' r='28' fill='#ff5a1f'/><text x='670' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>3</text><text x='644' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Budget and speed?</text><text x='644' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>One build, no reviews</text><text x='644' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Launch in weeks</text><text x='644' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Web app wins</text><rect x='905' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#ff5a1f' stroke-width='2'/><circle cx='955' cy='255' r='28' fill='#ff5a1f'/><text x='955' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>4</text><text x='929' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>How often updated?</text><text x='929' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Instant updates</text><text x='929' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>No store approval</text><text x='929' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Web app wins</text><text x='50' y='560' font-family='Inter,Helvetica,Arial,sans-serif' font-size='20' fill='#9a968e'>contentfellow.com</text></svg>