<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630'><rect width='1200' height='630' fill='#0c0c0d'/>
<text x='50' y='90' font-family='Inter,Helvetica,Arial,sans-serif' font-size='36' fill='#f5f3ee' font-weight='800'>What a booking website needs</text>
<text x='50' y='132' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' fill='#9a968e'>Get these right and no-shows drop</text><rect x='50' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='100' cy='255' r='28' fill='#ff5a1f'/><text x='100' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>1</text><text x='74' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Live availability</text><text x='74' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Real-time calendar</text><text x='74' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Staff and services</text><text x='74' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Buffer times</text><rect x='335' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='385' cy='255' r='28' fill='#ff5a1f'/><text x='385' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>2</text><text x='359' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Deposits</text><text x='359' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Card at booking</text><text x='359' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Cuts no-shows</text><text x='359' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Clear policy</text><rect x='620' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='670' cy='255' r='28' fill='#ff5a1f'/><text x='670' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>3</text><text x='644' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Reminders</text><text x='644' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Email and SMS</text><text x='644' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>24 hours before</text><text x='644' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>One-tap reschedule</text><rect x='905' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#ff5a1f' stroke-width='2'/><circle cx='955' cy='255' r='28' fill='#ff5a1f'/><text x='955' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>4</text><text x='929' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Your own site</text><text x='929' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Your brand, your clients</text><text x='929' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>No marketplace fee</text><text x='929' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Found on Google</text><text x='50' y='560' font-family='Inter,Helvetica,Arial,sans-serif' font-size='20' fill='#9a968e'>contentfellow.com</text></svg>