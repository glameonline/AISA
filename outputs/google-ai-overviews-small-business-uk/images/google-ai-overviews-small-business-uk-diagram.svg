<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630'><rect width='1200' height='630' fill='#0c0c0d'/>
<text x='50' y='90' font-family='Inter,Helvetica,Arial,sans-serif' font-size='36' fill='#f5f3ee' font-weight='800'>Four steps to get cited in AI Overviews</text>
<text x='50' y='132' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' fill='#9a968e'>Based on Google&#x27;s own guidance for site owners</text><rect x='50' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='100' cy='255' r='28' fill='#ff5a1f'/><text x='100' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>1</text><text x='74' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Be indexable</text><text x='74' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Googlebot allowed</text><text x='74' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Page indexed</text><text x='74' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Snippets not blocked</text><rect x='335' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='385' cy='255' r='28' fill='#ff5a1f'/><text x='385' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>2</text><text x='359' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Answer first</text><text x='359' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Answer in sentence one</text><text x='359' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Prices, areas, dates</text><text x='359' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>One page per question</text><rect x='620' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#2a2a2e' stroke-width='2'/><circle cx='670' cy='255' r='28' fill='#ff5a1f'/><text x='670' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>3</text><text x='644' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Prove the facts</text><text x='644' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Business Profile</text><text x='644' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Schema matches page</text><text x='644' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Reviews + mentions</text><rect x='905' y='200' width='255' height='270' rx='18' fill='#1c1c1f' stroke='#ff5a1f' stroke-width='2'/><circle cx='955' cy='255' r='28' fill='#ff5a1f'/><text x='955' y='265' font-family='Inter,Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='#0c0c0d' text-anchor='middle'>4</text><text x='929' y='330' font-family='Inter,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#f5f3ee'>Measure monthly</text><text x='929' y='400' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Search Console clicks</text><text x='929' y='428' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Check key questions</text><text x='929' y='456' font-family='Inter,Helvetica,Arial,sans-serif' font-size='18' fill='#9a968e'>Fix and repeat</text><text x='50' y='560' font-family='Inter,Helvetica,Arial,sans-serif' font-size='20' fill='#9a968e'>contentfellow.com</text></svg>