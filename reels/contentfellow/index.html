<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why ContentFellow</title>
<style>
  /* Two faces, both from contentfellow.com: Unbounded (display) and Instrument Sans (UI). */
  @font-face { font-family: Display; src: url(fonts/display-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Display; src: url(fonts/display-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Display; src: url(fonts/display-900.woff2) format('woff2'); font-weight: 900; }
  @font-face { font-family: UI; src: url(fonts/ui-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: UI; src: url(fonts/ui-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: UI; src: url(fonts/ui-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: UI; src: url(fonts/ui-700.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #0C0C0D; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
